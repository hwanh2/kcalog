<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      SVG 파비콘을 쓰지 않는 이유 — 마크의 `k`가 SVG 안에서는 **글자**라 방문자 기기에 그 폰트가
      없으면 다른 서체로 그려진다(디자인 원본은 Manrope). PNG로 두면 어디서나 같은 그림이다.
    -->
    <!-- 파비콘은 잔상(왼쪽 점들)을 뺀 그림이다. 32px에서는 점들이 색 얼룩으로 뭉개져
         링과 k만 남기는 편이 형태를 지킨다. 홈 화면 아이콘은 잔상이 있는 쪽을 쓴다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192-v2.png" />
    <!-- iOS는 홈 화면 아이콘에 manifest의 icons를 쓰지 않는다 — 이게 없으면 페이지 스크린샷이 들어간다 -->
    <link rel="apple-touch-icon" href="/icon-180-v2.png" />
    <!-- iOS 15.4 미만은 manifest의 display를 보지 않는다 — 없으면 홈 화면에서 열어도 주소창이 남는다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- viewport-fit=cover — 없으면 env(safe-area-inset-*)이 항상 0이라 노치 대응이 무효가 된다.
         확대·축소 잠금 ①/③ — 고정 폭 모바일 레이아웃이라 배율이 바뀌면 깨진 채로 남는다.
         Android Chrome과 iOS 홈 화면 실행은 여기서 막히고, iOS Safari 탭은 main.tsx가 맡는다 (design D5) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- 페이지 배경(--color-canvas)과 같은 값 — 어긋나면 PWA 상태 표시줄에 다른 색 띠가 생긴다 -->
    <meta name="theme-color" content="#f8fafc" />
    <!--
      밝은 화면 전용임을 알린다. 이 선언이 없으면 안드로이드 크롬과 삼성 인터넷의 자동 다크 테마가
      배경과 글자를 제멋대로 뒤집는다. 그때 PNG 마크는 뒤집히지 않아 남색 `k`만 어두운 배경에 묻힌다.
      앱에는 다크 팔레트가 없으므로(index.css에 prefers-color-scheme 분기 없음) 여기서 잠근다.
    -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="사진 한 장으로 10초 안에 식사가 기록되는 AI 식단·체중 관리 앱" />
    <title>칼로그 — 사진 한 장으로 10초 만에 식사 기록</title>
    <!-- 링크 미리보기(카카오톡·검색) — 절대 URL이어야 한다. 상대 경로는 크롤러가 받아가지 못한다 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="칼로그" />
    <meta property="og:title" content="칼로그 — 사진 한 장으로 10초 만에 식사 기록" />
    <meta property="og:description" content="찍으면 AI가 음식을 읽고 칼로리와 탄단지를 계산합니다. 체중·주간 리포트·AI 코치까지." />
    <meta property="og:url" content="https://kcalog.site/" />
    <!-- 원본은 tools/og/og.html — 문구·색이 바뀌면 거기서 다시 뽑는다 -->
    <meta property="og:image" content="https://kcalog.site/og.png" />
    <!-- 크기를 함께 알려주면 크롤러가 이미지를 받기 전에 카드 자리를 잡는다 -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="칼로그 홈 화면 — 남은 칼로리와 탄단지 달성도" />
    <!-- summary(작은 정사각 카드)로 두면 1200×630을 넣고도 큰 카드로 뜨지 않는다 -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
