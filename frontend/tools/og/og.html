<!doctype html>
<!--
  링크 미리보기 카드(og:image)의 원본. 여기서 `public/og.png`를 뽑는다.

  스크린샷이 아니라 HTML로 두는 이유 — 문구나 색이 바뀌었을 때 사람이 화면을 다시 찍지 않고
  아래 명령만 다시 돌리면 된다. 이미지에는 마크가 구워지므로, 마크를 바꾸면 여기서도 다시 뽑아야 한다.

  frontend/ 에서:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=public/og.png --window-size=1200,630 \
      "file://$PWD/tools/og/og.html"

  1200×630은 카카오톡·슬랙·트위터가 큰 카드로 띄우는 비율이다. 크기를 바꾸면
  index.html의 og:image:width/height도 같이 고쳐야 한다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 앱과 같은 토큰 — frontend/src/index.css에서 그대로 옮겨온다 */
      :root {
        --brand: #ff6b00;
        --ink: #0f172a;
        --surface: #ffffff;
        --canvas: #f8fafc;
        --track: #eef1f6;
        --carb: #f59e0b;
        --protein: #ef4444;
        --fat: #06b6d4;
        --muted: #5b6878;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--ink);
        /* 앱이 웹폰트를 쓰지 않는다(--font-sans: system-ui) — 카드도 같은 서체로 둔다 */
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        color: #fff;
        position: relative;
      }
      /* 랜딩 히어로의 얼룩과 같은 역할 — 어두운 면이 종이처럼 죽지 않게 한다 */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .glow-brand { width: 620px; height: 620px; right: -140px; top: -220px; background: rgba(255,107,0,.38); }
      .glow-fat { width: 460px; height: 460px; left: -160px; bottom: -220px; background: rgba(6,182,212,.22); }

      .stage {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        /* 카톡·슬랙이 가장자리를 깎을 수 있다 — 내용을 안쪽으로 물린다 */
        padding: 0 76px;
        gap: 64px;
      }

      .copy { flex: 1; }
      .brandline { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
      .brandline img { width: 60px; height: 60px; }
      .brandline span { font-size: 38px; font-weight: 800; letter-spacing: -.02em; }

      h1 {
        font-size: 76px;
        line-height: 1.16;
        font-weight: 800;
        letter-spacing: -.035em;
      }
      h1 em { font-style: normal; color: var(--brand); }

      p {
        margin-top: 28px;
        font-size: 30px;
        line-height: 1.5;
        color: #94a3b8;
        letter-spacing: -.01em;
      }

      .domain {
        margin-top: 44px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 25px;
        font-weight: 700;
        color: #cbd5e1;
      }
      .domain::before {
        content: '';
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--brand);
      }

      /* ── 폰 ── 어두운 배경 위 밝은 앱 면. 무엇을 하는 앱인지 글보다 빨리 읽힌다 */
      .phone {
        width: 320px;
        height: 530px;
        flex: none;
        border-radius: 44px;
        background: var(--ink);
        padding: 11px;
        box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.09);
        transform: rotate(-3deg);
      }
      .screen {
        width: 100%;
        height: 100%;
        border-radius: 34px;
        background: var(--canvas);
        color: var(--ink);
        padding: 30px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .greet { align-self: flex-start; font-size: 19px; font-weight: 700; color: var(--muted); }

      .ring { margin-top: 18px; position: relative; }
      .ring-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .ring-value { font-size: 52px; font-weight: 800; letter-spacing: -.04em; }
      .ring-label { font-size: 17px; font-weight: 700; color: var(--muted); margin-top: 2px; }

      .macros { width: 100%; margin-top: 30px; display: flex; flex-direction: column; gap: 17px; }
      .macro-head { display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; }
      .macro-head .amount { color: var(--muted); font-weight: 600; }
      .bar { margin-top: 7px; height: 9px; border-radius: 999px; background: var(--track); overflow: hidden; }
      .bar i { display: block; height: 100%; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div class="glow glow-brand"></div>
    <div class="glow glow-fat"></div>

    <div class="stage">
      <div class="copy">
        <div class="brandline">
          <!-- 앱이 쓰는 마크를 그대로 참조한다 — 복사해 두면 마크만 바뀌었을 때 조용히 어긋난다 -->
          <img src="../../public/kcalog-mark.png" alt="" />
          <span>kcalog</span>
        </div>
        <h1>사진 한 장으로<br /><em>10초 만에</em> 식사 기록</h1>
        <p>찍으면 AI가 음식을 읽고<br />칼로리와 탄단지를 계산합니다.</p>
        <div class="domain">kcalog.site</div>
      </div>

      <div class="phone">
        <div class="screen">
          <div class="greet">좋은 저녁이에요</div>

          <div class="ring">
            <svg width="188" height="188" viewBox="0 0 188 188">
              <circle cx="94" cy="94" r="80" fill="none" stroke="#eef1f6" stroke-width="17" />
              <!-- 둘레 502.4 중 약 74% — 남은 칼로리 510/1930과 맞물린다 -->
              <circle
                cx="94" cy="94" r="80" fill="none"
                stroke="#ff6b00" stroke-width="17" stroke-linecap="round"
                stroke-dasharray="372 503" transform="rotate(-90 94 94)"
              />
            </svg>
            <div class="ring-center">
              <div class="ring-value">510</div>
              <div class="ring-label">남은 kcal</div>
            </div>
          </div>

          <div class="macros">
            <div>
              <div class="macro-head"><span>탄수화물</span><span class="amount">178 / 241g</span></div>
              <div class="bar"><i style="width: 74%; background: var(--carb)"></i></div>
            </div>
            <div>
              <div class="macro-head"><span>단백질</span><span class="amount">92 / 145g</span></div>
              <div class="bar"><i style="width: 63%; background: var(--protein)"></i></div>
            </div>
            <div>
              <div class="macro-head"><span>지방</span><span class="amount">41 / 54g</span></div>
              <div class="bar"><i style="width: 76%; background: var(--fat)"></i></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
