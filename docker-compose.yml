services:
  db:
    image: postgres:16-alpine
    container_name: kcalog-db
    environment:
      POSTGRES_DB: kcalog
      POSTGRES_USER: kcalog
      POSTGRES_PASSWORD: kcalog
    ports:
      # 로컬 전용 — 외부 인터페이스에 노출하지 않는다
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 사진 Object Storage (S3 호환) — 로컬 개발용. 운영은 S3/R2 사용
  minio:
    image: minio/minio:latest
    container_name: kcalog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # 로컬 전용 — API 9000, 콘솔 9001
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  minio-data:
