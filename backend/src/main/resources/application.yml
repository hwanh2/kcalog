server:
  # 리버스 프록시(Traefik)가 TLS를 끝내고 평문으로 넘기므로, X-Forwarded-* 를 반영해야
  # OAuth redirect-uri({baseUrl})가 https로 만들어진다. 없으면 카카오 로그인이 실패한다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # health만 노출 — env·configprops 등이 열리면 시크릿이 새어나간다
        include: health
  endpoint:
    health:
      # 인증 없이 열려 있으므로 내부 구성(컴포넌트별 상태)은 감춘다. 전체 상태에는 DB 연결이 반영된다.
      show-details: never
      show-components: never
  health:
    mail:
      # 메일 스타터를 넣으면 SMTP 연결이 헬스체크에 끼어든다. 메일은 **의견 알림에만** 쓰는
      # 부수 기능이라, 메일 서버가 안 떠도 서비스는 정상이다. 켜두면 SMTP가 막히는 순간
      # /actuator/health가 DOWN이 되어 감시·로드밸런서가 서비스 전체를 죽은 것으로 본다.
      enabled: false

spring:
  application:
    name: kcalog-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kcalog}
    username: ${DB_USERNAME:kcalog}
    password: ${DB_PASSWORD:kcalog}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  # SMTP — host가 비어 있으면 JavaMailSender 빈이 만들어지지 않고, 알림만 건너뛴다.
  # Gmail은 일반 비밀번호로 로그인할 수 없다: 2단계 인증을 켜고 앱 비밀번호를 발급해 MAIL_PASSWORD에 넣는다.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # 587 포트는 평문으로 열고 STARTTLS로 승격한다 — 이게 없으면 자격증명이 평문으로 나간다
          starttls:
            enable: true
            required: true
        # 메일 서버가 응답하지 않을 때 스레드가 무한정 묶이지 않게 (ms)
        smtp.connectiontimeout: 5000
        smtp.timeout: 5000
        smtp.writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id-placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:placeholder}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
            # account_email은 카카오 앱 동의항목 설정 후 추가 (README 참고)
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    # 교차 출처 허용 목록(콤마 구분). 로컬은 Vite 프록시로 동일 출처라 비워둔다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # HS256 서명 키 — 32바이트 이상. 운영에서는 반드시 환경변수로 주입한다.
    secret: ${JWT_SECRET:kcalog-local-dev-only-secret-key-32bytes!}
    access-token-ttl: 30m
  refresh-token:
    ttl: 14d
  openai:
    # 식사 사진 분석. 로컬은 placeholder라 분석 호출 시 에러 — 실제 테스트엔 .env에 OPENAI_API_KEY 필요
    api-key: ${OPENAI_API_KEY:openai-key-placeholder}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    timeout: 20s
    daily-analysis-limit: 20
    daily-coach-chat-limit: ${OPENAI_DAILY_COACH_CHAT_LIMIT:30}
  analysis:
    # 개인 보정치를 분석 프롬프트에 주입할 최근 개수 상한 — 토큰·지연 방어(초과분 제외). 0이면 주입 없음.
    correction-inject-limit: ${ANALYSIS_CORRECTION_INJECT_LIMIT:50}
  feedback:
    # 의견이 도착하면 이 주소로 알린다. 비어 있으면 발송을 건너뛴다 — 저장은 그대로다.
    # 로컬·테스트는 비워두는 것이 기본이다(SMTP 없이도 의견 보내기가 동작해야 한다).
    mail-to: ${FEEDBACK_TO:}
    # 보내는 주소. 비우면 SMTP 계정(spring.mail.username)을 쓴다 — Gmail은 계정과 다른 주소로 보낼 수 없다.
    mail-from: ${FEEDBACK_FROM:}
  storage:
    # 사진 Object Storage — 로컬은 docker-compose MinIO 기본값으로 동작. 운영은 S3/R2 주입(application-prod.yml)
    bucket: ${STORAGE_BUCKET:kcalog-photos}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    path-style: ${STORAGE_PATH_STYLE:true}
    retention-hours: ${STORAGE_RETENTION_HOURS:24}
