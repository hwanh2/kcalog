# 운영 compose — 운영 VM(AWS EC2)에서만 쓴다. 로컬 개발은 레포 루트의 docker-compose.yml.
#   사용: docker compose -f compose.prod.yml up -d   (같은 디렉터리의 .env를 읽는다)
#
# ⚠️ `down -v` 금지. 로컬에서 DB를 초기화할 때 쓰는 습관대로 치면 db-data 볼륨이 지워져
#    운영 데이터가 전부 사라지고, traefik-acme까지 날아가 인증서를 재발급받다 Let's Encrypt
#    한도(동일 도메인 주 5회)에 걸린다. 컨테이너만 내릴 때는 `down`(볼륨 유지)을 쓴다.
#
# backend·db는 호스트 포트를 열지 않는다 — 외부에서 닿는 경로는 Traefik(80/443)뿐이다.
# 라우팅은 backend 서비스의 라벨에 붙어 있다(Traefik 방식): 서비스가 자기 라우팅 규칙을 들고 다닌다.

# 로그 용량 제한. 없으면 로그가 디스크를 채우고, 디스크가 차면 DB까지 같이 멈춘다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6.1
    container_name: kcalog-traefik
    restart: unless-stopped
    command:
      # 도커 컨테이너의 라벨을 읽어 라우팅을 구성한다
      - --providers.docker=true
      # 라벨로 명시한 서비스만 노출한다 — db가 실수로 외부에 열리는 것을 막는다
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # 평문 접속은 전부 HTTPS로 돌린다
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt 자동 발급·갱신 (TLS-ALPN-01 챌린지 — 443으로 검증)
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 라벨을 읽기 위해 도커 소켓이 필요하다. 읽기 전용으로만 준다(design Risks 참고).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 발급받은 인증서 — 지우면 Let's Encrypt 재발급 한도(주 5회)에 걸릴 수 있다
      - traefik-acme:/letsencrypt
    logging: *default-logging

  backend:
    image: ghcr.io/hwanh2/kcalog-backend:${IMAGE_TAG:-latest}
    container_name: kcalog-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # DB는 같은 compose 네트워크 안에 있다 — .env로 덮지 않는다
      DB_URL: jdbc:postgresql://db:5432/kcalog
      DB_USERNAME: kcalog
    ports:
      # actuator(관리 포트). 감시 서버의 Prometheus가 다른 VM에서 긁어가야 해서 호스트에 연다.
      # DB(127.0.0.1 제한)와 달리 루프백으로 묶을 수 없으므로 **보안 그룹이 유일한 통제 지점**이다.
      # 이 포트는 감시 서버의 보안 그룹에서 오는 요청만 허용할 것.
      - '8081:8081'
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.kcalog.site`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.service=api
      # 컨테이너 내부 포트. 호스트에 열지 않으므로 Traefik만 이 포트로 접근한다.
      - traefik.http.services.api.loadbalancer.server.port=8080
      # 헬스체크만 관리 포트로 공개 라우팅한다. actuator 전체가 8081로 옮겨갔는데
      # 배포 워크플로가 공개 주소의 /actuator/health로 기동을 확인하기 때문이다. 그 경로가
      # 앱 기동뿐 아니라 Traefik 라우팅과 인증서까지 함께 검증한다.
      # /actuator/prometheus는 어느 규칙에도 걸리지 않아 인터넷에서 닿지 않는다.
      - traefik.http.routers.health.rule=Host(`api.kcalog.site`) && Path(`/actuator/health`)
      - traefik.http.routers.health.entrypoints=websecure
      - traefik.http.routers.health.tls.certresolver=le
      - traefik.http.routers.health.service=health
      - traefik.http.services.health.loadbalancer.server.port=8081
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # 이 서버 자체의 디스크, 메모리, CPU. JVM 지표는 힙만 보여주므로 서버가 메모리 부족으로
  # 넘어가는 과정을 못 본다. 지금 컨테이너 메모리 제한이 없어 JVM 최대 힙이 VM 전체의 70퍼센트로
  # 잡히는데, 그 값을 다음 change에서 정할 근거가 여기서 나온다.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: kcalog-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # 도커의 overlay 마운트를 빼지 않으면 시계열이 수백 개 늘어난다
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --no-collector.mdadm
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.zfs
      - --no-collector.infiniband
    pid: host
    volumes:
      # rslave(마운트 전파)를 쓰지 않는다. 표준 예제에는 있지만 macOS Docker Desktop이
      # 지원하지 않아 로컬에서 뜨지 않고, 그러면 로컬에서 확인한 파일과 운영 파일이 달라진다(D12).
      # 대가는 컨테이너가 뜬 뒤에 새로 생긴 마운트를 못 본다는 것뿐이라 감수한다.
      - /:/host:ro
    ports:
      # 감시 서버가 다른 VM에서 긁어가므로 호스트에 연다. 8081과 마찬가지로
      # 루프백으로 묶을 수 없어 보안 그룹이 유일한 통제 지점이다.
      - '9100:9100'
    logging: *default-logging

  # 컨테이너 로그를 읽어 모니터링 VM의 Loki로 보낸다. 앱 서버에 두는 이유는 도커 소켓이
  # 이 서버에 있기 때문이다. 설정은 deploy/alloy.alloy 하나를 로컬 확인과 함께 쓴다 (D12).
  #
  # 🔴 LOKI_URL이 가리키는 Loki가 없으면 계속 재시도하며 에러 로그를 쌓는다.
  # 모니터링 VM을 먼저 띄운 뒤 배포할 것 (tasks.md 배포 순서 제약).
  alloy:
    image: grafana/alloy:v1.10.0
    container_name: kcalog-alloy
    restart: unless-stopped
    command:
      - run
      # 자기 진단 화면은 루프백에만 연다. 밖에서 볼 일이 없다.
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: ${LOKI_URL}
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      # 읽기 전용. 도커 소켓은 사실상 호스트 root 권한이라 쓰기까지 주지 않는다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging

  db:
    image: postgres:16-alpine
    container_name: kcalog-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: kcalog
      POSTGRES_USER: kcalog
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcalog"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

volumes:
  db-data:
  traefik-acme:
