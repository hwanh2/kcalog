# 모니터링 VM(t3.micro, 1GB)에 올리는 스택. 앱 서버와 분리한 이유는 design.md D1.
#
# 이 파일은 로컬에서도 그대로 돈다. 환경마다 다른 값은 전부 .env로 뺐다 (D12).
# 값을 박아두면 로컬에서 확인한 파일과 운영에 올리는 파일이 달라져, 확인했다는 사실이 의미를 잃는다.
#
#   로컬:  docker compose --profile local up -d      (Alloy까지 함께 띄워 로그도 흘린다)
#   운영:  docker compose up -d                      (Alloy는 앱 서버의 compose.prod.yml에 있다)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.5.1
    container_name: kcalog-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      # 앱 서버의 Alloy가 사설 IP로 보낸다. 운영에서는 LOKI_BIND에 이 VM의 사설 IP를 준다.
      # 기본값이 루프백이라, .env를 빠뜨리면 열리는 게 아니라 안 열린다.
      - '${LOKI_BIND:-127.0.0.1}:3100:3100'
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kcalog-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 보관 기간. Loki와 달리 Prometheus는 이 값이 없어도 기본 15일로 지우기는 한다
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # prometheus.yml은 늘 kcalog-backend:8081을 긁는다. 그 이름이 어디를 가리키는지만 환경마다 다르다.
      #   로컬: host-gateway(맥에서 도는 백엔드)   운영: 앱 서버의 사설 IP
      - 'kcalog-backend:${BACKEND_IP:-host-gateway}'
    ports:
      - '${UI_BIND:-127.0.0.1}:9090:9090'
    logging: *default-logging

  # 이 VM 자신의 디스크와 메모리. 앱 지표(micrometer)는 JVM 안만 보므로 서버가 말라죽는 것을 못 본다.
  # 특히 디스크가 중요하다. 차면 Loki가 죽는 대신 로그를 못 받는 상태로 조용히 버티는데(D8),
  # 그걸 감지할 수단이 이것뿐이다.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: kcalog-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # 도커가 만드는 overlay 마운트가 수백 개라 그대로 두면 시계열이 그만큼 늘어난다
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --no-collector.mdadm
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.zfs
      - --no-collector.infiniband
    pid: host
    volumes:
      # rslave(마운트 전파)를 쓰지 않는다. 표준 예제에는 있지만 macOS Docker Desktop이
      # 지원하지 않아 로컬에서 뜨지 않고, 그러면 로컬에서 확인한 파일과 운영 파일이 달라진다(D12).
      # 대가는 컨테이너가 뜬 뒤에 새로 생긴 마운트를 못 본다는 것뿐이라 감수한다.
      - /:/host:ro
    # 포트를 열지 않는다. 같은 compose 네트워크의 Prometheus만 부르면 된다.
    expose:
      - '9100'
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.1
    container_name: kcalog-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # 네트워크가 막혀 있어도 계정은 계정이다 (D9). 아무나 가입해 들어오지 못하게 막는다.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # 알림을 보낼 곳. 기본값은 자리를 채우기 위한 가짜 주소다.
      #
      # 비워 두면 Grafana가 기동을 거부한다("could not find webhook url property"). 알림 설정 하나
      # 때문에 로그와 지표까지 못 보게 되는 것은 과하다고 보고, 뜨는 쪽을 골랐다.
      #
      # 대가는 .env를 빠뜨렸을 때 **알림이 조용히 안 가는 것**이다. 두 가지가 이를 막는다.
      # 외부 업타임 서비스가 Grafana와 무관하게 서비스를 감시하고(D10), tasks 10.4가
      # "실제로 슬랙에 오는지"를 눈으로 확인하게 되어 있다.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/WEBHOOK/URL/MISSING}
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/files:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 운영에서는 UI_BIND에 이 VM의 Tailscale 주소(100.x.x.x)를 준다. 그러면 tailnet 안에서만 보인다.
      - '${UI_BIND:-127.0.0.1}:3000:3000'
    depends_on:
      - loki
      - prometheus
    logging: *default-logging

  # 로컬 확인용. 운영에서 앱 서버의 node exporter는 compose.prod.yml에 있고 9100을 호스트에 연다.
  # 맥에는 서버가 한 대뿐이라, Prometheus가 `kcalog-backend:9100`으로 찾아갈 수 있게 그 포트를 열어 흉내낸다.
  node-exporter-app:
    profiles: [local]
    image: prom/node-exporter:v1.9.1
    container_name: kcalog-node-exporter-app
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      # rslave(마운트 전파)를 쓰지 않는다. 표준 예제에는 있지만 macOS Docker Desktop이
      # 지원하지 않아 로컬에서 뜨지 않고, 그러면 로컬에서 확인한 파일과 운영 파일이 달라진다(D12).
      # 대가는 컨테이너가 뜬 뒤에 새로 생긴 마운트를 못 본다는 것뿐이라 감수한다.
      - /:/host:ro
    ports:
      - '127.0.0.1:9100:9100'
    logging: *default-logging

  # 로컬 확인용. 운영에서 Alloy는 앱 서버(compose.prod.yml)에 있다.
  # 로그를 읽으려면 그 서버의 도커 소켓에 붙어야 하기 때문이다.
  alloy:
    profiles: [local]
    image: grafana/alloy:v1.10.0
    container_name: kcalog-alloy-local
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - ../alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
